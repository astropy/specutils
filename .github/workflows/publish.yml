name: Release

on:
  # NOTE: PR trigger is to ensure changes do not break packaging.
  pull_request:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    permissions:
      contents: none
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    if: github.repository == 'astropy/specutils'
    with:
      env: |
        PY_IGNORE_IMPORTMISMATCH: 1
      # We use trusted publishing so the upload is handled in a separate job below
      upload_to_pypi: false
      save_artifacts: true
      upload_to_anaconda: false
      test_extras: test
      test_command: pytest --astropy-header --pyargs specutils

  upload:
    name: Publish to PyPI
    if: github.repository == 'astropy/specutils' && github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/specutils
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
